name: Build and deploy ASP.Net Core app to Azure Web App - workerSafety

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      # Build only the web project (avoids the missing test project)
      - name: Build with dotnet
        run: dotnet build ./WorkerSafetyDashboard.csproj --configuration Release

      - name: Publish
        run: |
          dotnet publish ./WorkerSafetyDashboard.csproj 
            --configuration Release \
            --output ./publish \
            --no-build

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ./publish

  deploy:
    runs-on: windows-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'workerSafety'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_C2AF5CCB0DDC4E5099B558A7BA81B986 }}
